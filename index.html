<style>
:root{
  --bg:#f5f5f7; --card:#fff; --text:#111418; --muted:#6b7280; --line:#e3e5e9;
  --accent:#227a4c; --accent-soft:#e6f2ec; --danger:#c2381f;
  --wal:#2a6ebb; --sam:#0b7ac0; --prod:#5b8c2a;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1c1d21; --text:#f2f3f5; --muted:#9aa0a8; --line:#2e3036;
    --accent:#3fa76c; --accent-soft:#16301f; --danger:#e5674c;
    --wal:#5b9ae0; --sam:#43a8e8; --prod:#8fc457;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top);
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}

/* ---- header ---- */
header{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:10px 16px 0;
}
h1{font-size:26px;font-weight:700;margin:4px 0 10px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;font-weight:400}

/* ---- main ---- */
main{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.view{display:none}
.view.on{display:block}

/* ---- search + chips ---- */
.search{
  width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);margin-bottom:10px;font-size:16px;
}
.chips{
  display:flex;gap:7px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:14px;white-space:nowrap;color:var(--muted);
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* ---- sections + rows ---- */
.cat{margin:18px 0 7px;font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted)}
.list{background:var(--card);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}
.row{
  display:flex;align-items:center;gap:12px;padding:0 14px;min-height:52px;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;padding:9px 0}
.name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .name{color:var(--muted)}
.meta{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.box{
  flex:0 0 auto;width:26px;height:26px;border-radius:999px;border:2px solid var(--line);
  display:grid;place-items:center;
}
.row.done .box{background:var(--accent);border-color:var(--accent)}
.box svg{display:none;width:15px;height:15px}
.row.done .box svg{display:block}
.tap{display:flex;align-items:center;gap:12px;flex:1;min-width:0}

/* store pill */
.store{
  flex:0 0 auto;font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;
  border:1px solid transparent;letter-spacing:.01em;
}
.s0{background:color-mix(in srgb,var(--wal) 14%,transparent);color:var(--wal)}
.s1{background:color-mix(in srgb,var(--sam) 14%,transparent);color:var(--sam)}
.s2{background:color-mix(in srgb,var(--prod) 18%,transparent);color:var(--prod)}

/* ---- order tab ---- */
.storehead{
  display:flex;align-items:baseline;gap:8px;margin:20px 0 7px;
}
.storehead b{font-size:17px;letter-spacing:-.01em}
.storehead span{font-size:13px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.qty button{
  width:30px;height:30px;border-radius:8px;background:var(--bg);
  font-size:17px;font-weight:600;color:var(--accent);display:grid;place-items:center;
}
.qty b{min-width:20px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:60px 24px;font-size:15px}
.empty svg{width:44px;height:44px;opacity:.3;margin-bottom:12px}

.btn{
  display:block;width:100%;padding:15px;border-radius:13px;background:var(--accent);
  color:#fff;font-size:16px;font-weight:600;text-align:center;margin-top:22px;
}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);margin-top:10px}
.btn.warn{background:var(--card);color:var(--danger);border:1px solid var(--line);margin-top:10px}

/* ---- history ---- */
.hcard{background:var(--card);border-radius:13px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.hcard summary{display:flex;justify-content:space-between;align-items:center;
  list-style:none;cursor:pointer;gap:10px}
.hcard summary::-webkit-details-marker{display:none}
.hcard .d{font-weight:600}
.hcard .c{font-size:13px;color:var(--muted)}
.hline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-top:1px solid var(--line);font-size:14px}
.hline:first-of-type{margin-top:10px}

/* ---- manage ---- */
.card{background:var(--card);border-radius:13px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:700;margin:0 0 3px}
.card p{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.field{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);margin-bottom:9px;font-size:16px}
select.field{-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b7280' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center}
.mini{padding:11px;font-size:15px;border-radius:10px;background:var(--accent);color:#fff;
  font-weight:600;width:100%;text-align:center}
.del{flex:0 0 auto;color:var(--danger);font-size:13px;font-weight:600;padding:8px 4px}
.editname{flex:1;min-width:0;background:none;border:0;padding:9px 0;font-size:16px}

/* ---- tab bar ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:600;color:var(--muted);position:relative;
}
nav button.on{color:var(--accent)}
nav svg{width:23px;height:23px}
.badge{
  position:absolute;top:3px;left:50%;margin-left:6px;background:var(--danger);color:#fff;
  font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:999px;
  display:grid;place-items:center;padding:0 4px;
}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:8px;right:8px;bottom:8px;z-index:41;background:var(--card);
  border-radius:16px;padding:8px;transform:translateY(120%);transition:transform .22s ease;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
}
.sheet.on{transform:none}
.sheet h3{margin:10px 12px 8px;font-size:13px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:15px 12px;border-radius:11px;font-size:17px;text-align:left}
.opt:active{background:var(--bg)}
.opt.on{color:var(--accent);font-weight:600}
.opt .tick{display:none}
.opt.on .tick{display:block}
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(78px + env(safe-area-inset-bottom));
  background:#111;color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;z-index:50;
  opacity:0;transition:.2s;pointer-events:none;max-width:88%;text-align:center;
}
.toast.on{opacity:.95;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <h1 id="title">Shop</h1>
  <div id="tools"></div>
</header>

<main>
  <section class="view on" id="v-shop"></section>
  <section class="view" id="v-order"></section>
  <section class="view" id="v-hist"></section>
  <section class="view" id="v-manage"></section>
</main>

<nav id="tabs"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

const STORES = ["Wal-Mart", "Sam's Club", "Produce Store"];
const KEY = "grocery-shopper-v1";

/* Seeded from inventory.xlsx. "Toilet Cleaner" corrects a typo in the source sheet. */
const SEED = {
  "Dairy":["Greek yogurt","Eggs","Milk","Fiesta cheese","Sandwich cheese","Spread Butter","Cooking Butter","Sour Cream"],
  "Meat":["Chicken Breast","Ground Beef","Sandwich Meat"],
  "Bakery":["Bread","Tortillas"],
  "Frozen":["Mixed Veggies","Pizza","Chicken Nuggets","Hashbrowns"],
  "Pantry":["Pasta Sauce","Rice","Oatmeal","Salt","White Flour","Wheat Flour","Soup","Peanut Butter","Pancake Mix","Beans","Mac n Cheese","Apple Sauce","Tortilla Chips","Fruit Cups","Crackers","Hummus"],
  "Sauces":["Mustard","Ketchup","Mayo","BBQ Sauce","Jam","Maple Syrup","Hot Sauce"],
  "Spices":["Soy Sauce","Ginger Paste","Salsa","Honey"],
  "Paper Goods":["Toilet Paper","Paper Towels","Liners","Pads","Tissues"],
  "Food Storage":["Plastic Wrap","Tin Foil","Sandwich Baggies","Large Ziplocks","Small Ziplocks"],
  "Cleaning":["Hand Soap","Dish Soap","Window Cleaner","Toilet Cleaner","Bathroom Spray","Mrs Meyers Solution","Bleach","Disinfectant Wipes","Barkeepers Friend","Dish Detergent","Laundry Detergent","Scrub Daddy"],
  "Parents Toiletries":["Tooth Paste","Shampoo","Body Wash","Conditioner","Face Lotion","Deodorant","Shaving Cream","Razors"],
  "Kids Toiletries":["Detangle Spray","Tooth Paste","Bubble Bath","Shampoo","Body Wash","Lotion"],
  "Baby":["Diapers","Wipes","Diaper Cream"],
  "Makeup":["Lip Balm","Mascara","Blush","Concealer","Eyebrow Pencil","Polish Remover","Polish"]
};

/* ---------- state ---------- */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const uid = () => Math.random().toString(36).slice(2,9);

function seed(){
  const items = [];
  for (const [cat, names] of Object.entries(SEED))
    for (const n of names)
      items.push({ id: slug(cat)+"_"+slug(n), name:n, cat, store:0 });
  return { v:1, cats:Object.keys(SEED), items, checked:{}, history:[] };
}

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.items)) return seed();
    s.checked = s.checked || {}; s.history = s.history || [];
    s.cats = s.cats || [...new Set(s.items.map(i=>i.cat))];
    return s;
  } catch { return seed(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch{ toast("Couldn't save — storage may be full"); }
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId = id => state.items.find(i => i.id === id);
const storeOf = id => { const c = state.checked[id]; return c && c.store != null ? c.store : (byId(id)?.store ?? 0); };
const checkedIds = () => Object.keys(state.checked).filter(byId);

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2200);
}

const TICK = '<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-8.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- sheet (store picker) ---------- */
function sheet(title, opts, cur, pick){
  const el = $("#sheet");
  el.innerHTML = `<h3>${esc(title)}</h3>` + opts.map((o,i)=>
    `<button class="opt ${i===cur?"on":""}" data-i="${i}">${esc(o)}
      <span class="tick"><svg viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M4 10.5l4 4 8-8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>`).join("");
  el.onclick = e => {
    const b = e.target.closest(".opt"); if (!b) return;
    closeSheet(); pick(+b.dataset.i);
  };
  $("#scrim").classList.add("on");
  requestAnimationFrame(()=> el.classList.add("on"));
}
function closeSheet(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = closeSheet;

/* ---------- tabs ---------- */
const ICONS = {
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>',
  order:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  manage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2 2 2 0 11-4 0 1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15a2 2 0 010-4 1.7 1.7 0 001.2-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 0010 4a2 2 0 014 0a1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 11a2 2 0 010 4z"/></svg>'
};
const TABS = [["shop","Shop"],["order","Order"],["hist","History"],["manage","Manage"]];
let tab = "shop";

function renderTabs(){
  const n = checkedIds().length;
  $("#tabs").innerHTML = TABS.map(([k,label])=>
    `<button data-t="${k}" class="${tab===k?"on":""}">${ICONS[k]}<span>${label}</span>${
      k==="order"&&n ? `<i class="badge">${n}</i>` : ""}</button>`).join("");
}
$("#tabs").onclick = e => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  tab = b.dataset.t; render(); window.scrollTo(0,0);
};

/* ---------- shop view ---------- */
let query = "", activeCat = "";

function renderShop(){
  const q = query.trim().toLowerCase();
  const cats = state.cats.filter(c => state.items.some(i=>i.cat===c));

  $("#tools").innerHTML =
    `<input class="search" id="q" type="search" placeholder="Search items" value="${esc(query)}">` +
    (q ? "" : `<div class="chips">${cats.map(c=>
      `<button class="chip ${activeCat===c?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`);

  const shown = cats.map(c => [c, state.items.filter(i =>
      i.cat===c && (!q || i.name.toLowerCase().includes(q)))])
    .filter(([,arr]) => arr.length);

  $("#v-shop").innerHTML = shown.length ? shown.map(([c,arr]) =>
    `<div class="cat" id="cat-${slug(c)}">${esc(c)}</div>
     <div class="list">${arr.map(rowHTML).join("")}</div>`).join("")
    : `<div class="empty">No items match “${esc(query)}”</div>`;
}

function rowHTML(i){
  const on = !!state.checked[i.id], s = storeOf(i.id);
  return `<div class="row ${on?"done":""}">
    <button class="tap" data-check="${i.id}">
      <span class="box">${TICK}</span>
      <span class="grow"><span class="name">${esc(i.name)}</span></span>
    </button>
    <button class="store s${s}" data-store="${i.id}">${esc(STORES[s])}</button>
  </div>`;
}

/* ---------- order view ---------- */
function renderOrder(){
  $("#tools").innerHTML = "";
  const ids = checkedIds();
  if (!ids.length){
    $("#v-order").innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
      <div>Nothing checked off yet.</div>
      <div style="margin-top:6px">Tap items on the Shop tab to build this week's order.</div></div>`;
    return;
  }
  let html = "";
  STORES.forEach((name, si) => {
    const rows = ids.filter(id => storeOf(id) === si);
    if (!rows.length) return;
    const n = rows.reduce((a,id)=> a + (state.checked[id].qty||1), 0);
    html += `<div class="storehead"><b>${esc(name)}</b><span>${n} item${n>1?"s":""}</span></div>
      <div class="list">${rows.map(id => {
        const it = byId(id), c = state.checked[id];
        return `<div class="row">
          <span class="grow"><span class="name">${esc(it.name)}</span>
            <span class="meta">${esc(it.cat)}${c.store!=null?" · store changed":""}</span></span>
          <span class="qty">
            <button data-q="-1" data-id="${id}">−</button>
            <b>${c.qty||1}</b>
            <button data-q="1" data-id="${id}">+</button>
          </span>
          <button class="store s${si}" data-store="${id}">Move</button>
        </div>`;
      }).join("")}</div>`;
  });
  const total = ids.reduce((a,id)=> a + (state.checked[id].qty||1), 0);
  html += `<button class="btn" id="finalize">Finalize order · ${total} item${total>1?"s":""}</button>
           <button class="btn warn" id="clear">Uncheck everything</button>
           <p style="font-size:12px;color:var(--muted);text-align:center;margin:14px 4px 0;line-height:1.5">
             Finalizing saves this order to History with today's date, then unchecks the boxes.
             Neither button ever removes items from your inventory.</p>`;
  $("#v-order").innerHTML = html;
}

/* ---------- history view ---------- */
function renderHist(){
  $("#tools").innerHTML = "";
  if (!state.history.length){
    $("#v-hist").innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <div>No finalized orders yet.</div>
      <div style="margin-top:6px">Every order you finalize is recorded here — that record is what future
      "what do you usually buy" features will learn from.</div></div>`;
    return;
  }
  $("#v-hist").innerHTML = state.history.slice().reverse().map(h => {
    const d = new Date(h.ts);
    const date = d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
    const n = h.lines.reduce((a,l)=>a+l.qty,0);
    return `<details class="hcard"><summary>
        <span class="d">${esc(date)}</span>
        <span class="c">${n} item${n>1?"s":""} ›</span></summary>
      ${h.lines.map(l=>`<div class="hline">
        <span>${esc(l.name)}${l.qty>1?` <span class="c">×${l.qty}</span>`:""}</span>
        <span class="c">${esc(l.store)}</span></div>`).join("")}
    </details>`;
  }).join("");
}

/* ---------- manage view ---------- */
function renderManage(){
  $("#tools").innerHTML = "";
  const cats = state.cats;
  $("#v-manage").innerHTML = `
  <div class="card">
    <h2>Add an item</h2>
    <p>New items are saved on this device and show up on the Shop tab right away.</p>
    <input class="field" id="ni" placeholder="Item name">
    <select class="field" id="nc">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}
      <option value="__new">+ New category…</option></select>
    <select class="field" id="ns">${STORES.map((s,i)=>`<option value="${i}">${esc(s)}</option>`).join("")}</select>
    <button class="mini" id="add">Add item</button>
  </div>

  <div class="card">
    <h2>Backup &amp; restore</h2>
    <p>Phone storage can get cleared. Export a backup now and then — and add this app
       to the Home Screen, which keeps Safari from wiping its data.</p>
    <button class="btn ghost" style="margin-top:0" id="exp">Export backup (.json)</button>
    <button class="btn ghost" id="copy">Copy backup to clipboard</button>
    <button class="btn ghost" id="imp">Import backup…</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>

  <div class="card">
    <h2>All items · ${state.items.length}</h2>
    <p>Tap a name to rename it, the store pill to change its default store.</p>
    ${cats.filter(c=>state.items.some(i=>i.cat===c)).map(c=>
      `<div class="cat">${esc(c)}</div>
       <div class="list">${state.items.filter(i=>i.cat===c).map(i=>{
         return `<div class="row">
           <input class="editname" value="${esc(i.name)}" data-rename="${i.id}">
           <button class="store s${i.store}" data-default="${i.id}">${esc(STORES[i.store])}</button>
           <button class="del" data-del="${i.id}">Delete</button>
         </div>`;}).join("")}</div>`).join("")}
  </div>`;
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("#v-"+tab).classList.add("on");
  $("#title").textContent = {shop:"Shop",order:"This Week's Order",hist:"History",manage:"Manage"}[tab];
  ({shop:renderShop, order:renderOrder, hist:renderHist, manage:renderManage})[tab]();
  renderTabs();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;

  const chk = t.closest("[data-check]");
  if (chk){
    const id = chk.dataset.check;
    if (state.checked[id]) delete state.checked[id];
    else state.checked[id] = { qty:1, store:null };
    save();
    // repaint just this row, keep scroll position
    const row = chk.closest(".row");
    row.classList.toggle("done", !!state.checked[id]);
    renderTabs();
    return;
  }

  const st = t.closest("[data-store]");
  if (st){
    const id = st.dataset.store;
    sheet("Buy this at", STORES, storeOf(id), i => {
      const it = byId(id);
      if (state.checked[id]) state.checked[id].store = (i === it.store ? null : i);
      else it.store = i;
      save(); render();
    });
    return;
  }

  const df = t.closest("[data-default]");
  if (df){
    const it = byId(df.dataset.default);
    sheet("Default store · " + it.name, STORES, it.store, i => { it.store = i; save(); render(); });
    return;
  }

  const q = t.closest("[data-q]");
  if (q){
    const c = state.checked[q.dataset.id]; if (!c) return;
    c.qty = Math.max(1, (c.qty||1) + (+q.dataset.q));
    save(); renderOrder();
    return;
  }

  const chip = t.closest("[data-c]");
  if (chip){
    const c = chip.dataset.c;
    activeCat = activeCat === c ? "" : c;
    renderShop();
    if (activeCat){
      const el = $("#cat-"+slug(c));
      if (el) window.scrollTo({ top: el.offsetTop - 8, behavior:"smooth" });
    }
    return;
  }

  const del = t.closest("[data-del]");
  if (del){
    const it = byId(del.dataset.del);
    if (confirm(`Delete “${it.name}” from the inventory?`)){
      state.items = state.items.filter(i => i.id !== it.id);
      delete state.checked[it.id];
      save(); render();
    }
    return;
  }

  if (t.id === "finalize") finalize();
  if (t.id === "clear" && confirm("Uncheck all items?\n\nThis only clears this week's checkmarks — your item list stays exactly as it is, and nothing is saved to History.")){
    state.checked = {}; save(); render();
  }
  if (t.id === "add") addItem();
  if (t.id === "exp") exportJSON();
  if (t.id === "copy") copyJSON();
  if (t.id === "imp") $("#file").click();
});

document.addEventListener("input", e => {
  if (e.target.id === "q"){ query = e.target.value; activeCat = "";
    const shop = $("#v-shop"); const q = query.trim().toLowerCase();
    // re-render list only, so the input keeps focus
    const cats = state.cats.filter(c => state.items.some(i=>i.cat===c));
    const shown = cats.map(c => [c, state.items.filter(i => i.cat===c && (!q || i.name.toLowerCase().includes(q)))])
      .filter(([,a]) => a.length);
    shop.innerHTML = shown.length ? shown.map(([c,arr]) =>
      `<div class="cat" id="cat-${slug(c)}">${esc(c)}</div><div class="list">${arr.map(rowHTML).join("")}</div>`).join("")
      : `<div class="empty">No items match “${esc(query)}”</div>`;
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "nc" && e.target.value === "__new"){
    const name = (prompt("New category name") || "").trim();
    if (name && !state.cats.includes(name)){ state.cats.push(name); save(); render();
      const sel = $("#nc"); if (sel) sel.value = name; }
    else e.target.selectedIndex = 0;
  }
  if (e.target.dataset && e.target.dataset.rename !== undefined){
    const it = byId(e.target.dataset.rename);
    const v = e.target.value.trim();
    if (it && v){ it.name = v; save(); } else if (it) e.target.value = it.name;
  }
  if (e.target.id === "file"){
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => importJSON(r.result);
    r.readAsText(f);
    e.target.value = "";
  }
});

/* ---------- actions ---------- */
function addItem(){
  const name = $("#ni").value.trim();
  if (!name) return toast("Give the item a name first");
  const cat = $("#nc").value, store = +$("#ns").value;
  if (cat === "__new") return toast("Pick a category first");
  if (state.items.some(i => i.cat===cat && i.name.toLowerCase()===name.toLowerCase()))
    return toast(name + " is already in " + cat);
  state.items.push({ id: slug(cat)+"_"+slug(name)+"_"+uid(), name, cat, store });
  save(); render(); toast(`Added ${name} to ${cat}`);
}

function finalize(){
  const ids = checkedIds();
  if (!ids.length) return;
  const lines = ids.map(id => {
    const it = byId(id);
    // id links the line back to the item so renames don't split its history;
    // name/cat/store stay denormalized so a past order still reads correctly
    // after the item is renamed or deleted.
    return { id: it.id, name: it.name, cat: it.cat, store: STORES[storeOf(id)], qty: state.checked[id].qty || 1 };
  });
  state.history.push({ ts: Date.now(), lines });
  state.checked = {};
  save(); tab = "hist"; render(); window.scrollTo(0,0);
  toast("Order saved to History");
}

function backup(){
  return JSON.stringify({ app:"grocery-shopper", v:1, exported:new Date().toISOString(), state }, null, 2);
}
function exportJSON(){
  const blob = new Blob([backup()], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "groceries-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function copyJSON(){
  try { await navigator.clipboard.writeText(backup()); toast("Backup copied — paste it somewhere safe"); }
  catch { toast("Couldn't copy — use Export instead"); }
}
function importJSON(text){
  let data;
  try { data = JSON.parse(text); } catch { return toast("That file isn't valid JSON"); }
  const s = data && data.state ? data.state : data;
  if (!s || !Array.isArray(s.items)) return toast("That doesn't look like a groceries backup");
  if (!confirm(`Replace what's on this phone with this backup?\n\n${s.items.length} items, ${(s.history||[]).length} saved orders.`)) return;
  state = {
    v:1,
    cats: s.cats || [...new Set(s.items.map(i=>i.cat))],
    items: s.items,
    checked: s.checked || {},
    history: s.history || []
  };
  save(); render(); toast("Backup restored");
}

render();
</script>
</body>
</html>
